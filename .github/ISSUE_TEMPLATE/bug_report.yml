name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior in Onee Island"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please search existing issues first to check if it has already been reported.

  - type: input
    id: version
    attributes:
      label: "Onee Island Version"
      description: "Which version or commit of Onee Island are you running?"
      placeholder: "e.g. v1.0.0 or commit f33a4de"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: "Windows Operating System"
      description: "What version of Windows are you using?"
      options:
        - "Windows 11 (23H2 or newer)"
        - "Windows 11 (22H2 / 21H2)"
        - "Windows 10 (Build 19041+)"
        - "Other / Insider Preview"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Describe the Bug"
      description: "A clear and concise description of what the problem is."
      placeholder: "When I expand the media island while Spotify is playing..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "List the step-by-step instructions to reproduce the issue."
      placeholder: |
        1. Open Onee Island
        2. Play music on Spotify
        3. Click the notch pill to expand
        4. Observe the issue
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen instead?"
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: "Screenshots / Screen Recordings"
      description: "Drag and drop any screenshots or GIF/videos showing the issue."
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: "Sanity Checks"
      options:
        - label: "I have searched existing issues and confirmed this is not a duplicate."
          required: true
        - label: "I have verified that my Windows system meets the minimum requirements (.NET 10 & WebView2)."
          required: false
